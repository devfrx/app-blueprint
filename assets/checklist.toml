# Catalogo delle voci dei gate — app-blueprint, metodo 3
#
# La fonte unica della checklist di fase. Il progetto non la copia: lo script
# calcola dalla scheda (esposizione, criticità, inneschi) quali voci valgono,
# quali sono rinviate nel debito di pubblicazione e quali non si applicano, e
# legge in docs/progettazione/gate.toml solo le chiusure.
#
# Campi di una voce:
#   id, fase, testo
#   quando     condizione d'applicabilità (sintassi in references/profili.md)
#   natura     "progetto" (difficile da invertire) | "esercizio" (operativa):
#              con esposizione "pubblicabile" le voci di progetto valgono come
#              per un'app pubblica, quelle di esercizio vanno nel debito di
#              pubblicazione
#   per_incremento
#              true se la voce si richiude a ogni incremento: la sua chiusura porta
#              "incremento", e aprire l'incremento successivo la riapre. Lo è ogni
#              voce il cui controllo dipende dall'incremento corrente, e ogni voce
#              delle fasi 8–12
#   origine    "checklist" (testo della checklist di riferimento) |
#              "adattata" (adattata al lavoro con agenti; il perché in "nota") |
#              "metodo" (aggiunta dal metodo)
#   dove       dove vive di solito l'evidenza
#   legge      tipi di sorgente che servono per lavorarla (progetto.py fascio)
#   dipende    voci che devono essere chiuse prima (frontiera)
#   controllo  controlli dello script che devono passare per chiuderla
#   skill      chi la esegue, se diverso dalla skill della fase

versione = "3.0.0"

# Gli inneschi: fatti che attivano voci a prescindere dal profilo. La
# valutazione giuridica non sta qui: con dati personali o mercato UE entra
# compliance-docs, e gli obblighi correnti si verificano al momento.
[inneschi]
ui = "L'app ha un'interfaccia utente."
api-pubblica = "Espone API usate da terzi, oltre al proprio frontend."
dati-personali = "Tratta dati personali di persone diverse dall'autore."
dati-particolari = "Tratta categorie particolari di dati personali (salute, biometria, opinioni…) o dati di minori."
denaro = "Muove o calcola denaro: pagamenti, saldi, fatture, prezzi con conseguenze economiche."
integrazioni = "Dialoga con sistemi esterni (servizi, API di terzi, posta, pagamenti)."
migrazione-dati = "Importa dati da un sistema o da archivi esistenti."
ia = "Contiene funzionalità basate su modelli di intelligenza artificiale."
mercato-ue = "È messa a disposizione sul mercato UE nell'ambito di un'attività commerciale, anche gratuita: rientra nel Cyber Resilience Act."
commissionato = "È sviluppata per un committente, o acquistata: contratto, proprietà intellettuale, accettazione, livelli di servizio."
multitenant = "Serve più organizzazioni isolate nello stesso sistema."

