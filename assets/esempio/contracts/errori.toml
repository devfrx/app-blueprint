# Catalogo degli errori e regole di validazione — fonte unica per backend e frontend.
# Formato di risposta: Problem Details (ST-errori), con il codice nel campo type.
# categoria dice cosa si recupera e cosa si propaga; utente è la chiave del testo
# che l'utente vede (ux/testi.toml); log è il livello con cui si registra.

[[errori]]
codice = "validazione"
categoria = "validazione"
http = 422
recuperabile = true
log = "debug"
utente = "errore.validazione"

[[errori]]
