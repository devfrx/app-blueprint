[[validazioni]]
campo = "cliente.codice_fiscale"
regola = "16 caratteri alfanumerici con il carattere di controllo corretto"
errore = "codice-fiscale-non-valido"

[[validazioni]]
campo = "cliente.email"
regola = "indirizzo email sintatticamente valido, al massimo 254 caratteri"
errore = "validazione"

[[validazioni]]
campo = "veicolo.targa"
regola = "dopo la normalizzazione, da 5 a 10 caratteri alfanumerici"
errore = "validazione"

[[validazioni]]
campo = "riga_preventivo.quantita"
regola = "numero maggiore di zero con al massimo due decimali"
errore = "quantita-non-valida"

[[validazioni]]
campo = "account.password"
regola = "almeno 12 caratteri"
errore = "password-debole"
