  { nome = "descrizione", tipo = "varchar(200)", nullo = false, da = "voce_listino.descrizione" },
  { nome = "tipo", tipo = "varchar(12)", nullo = false, descrizione = "manodopera o ricambio: accorpamento della generalizzazione", traccia = ["INT-5"] },
