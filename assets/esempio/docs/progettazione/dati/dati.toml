# --- ristrutturazione -----------------------------------------------------------------

[[ristrutturazione]]
id = "generalizzazione-listino"
tipo = "generalizzazione"
oggetto = "generalizzazione:voce-listino-tipo"
decisione = "Accorpamento dei figli nel padre: una tabella voci_listino con il tipo e le colonne facoltative di manodopera e ricambio."
motivo = "AC-5 e INT-5 leggono le voci senza distinguere il tipo; ogni figlio aggiunge un solo attributo facoltativo."
accessi = ["AC-5"]

[[ristrutturazione]]
id = "totale-preventivo"
tipo = "ridondanza"
oggetto = "attributo:preventivo.totale"
decisione = "Non memorizzato: lo calcola il motore dei prezzi a ogni lettura."
motivo = "AC-5: 300 letture al giorno da 5 righe costano poco; memorizzarlo vorrebbe dire aggiornarlo a ogni riga finché il preventivo è in bozza, con il rischio di divergere da R-2."
accessi = ["AC-5", "AC-2"]

[[ristrutturazione]]
id = "totale-fattura"
tipo = "ridondanza"
oggetto = "attributo:fattura.totale"
decisione = "Memorizzato all'emissione e mai aggiornato."
motivo = "La fattura è immutabile (R-3): nessun costo d'aggiornamento; AC-6 legge il totale senza ricalcolare le righe."
accessi = ["AC-6"]

[[ristrutturazione]]
id = "identificatori-surrogati"
tipo = "identificatore"
oggetto = "entita:intervento"
decisione = "Chiave primaria surrogata ULID per tutte le tabelle; codice, targa, codice fiscale, email e (anno, numero) restano unici."
motivo = "ST-identificatori: id non indovinabili negli URL (MI-1)."

[[ristrutturazione]]
id = "voce-riga-copiata"
tipo = "accorpamento"
oggetto = "relazione:voce-riga"
decisione = "Nessuna chiave esterna verso il listino: la riga copia codice, descrizione, tipo, prezzo e aliquota della voce."
motivo = "Il prezzo storico non cambia con il listino (R-2), e così nessuna chiave esterna attraversa i moduli interventi e prezzi."

