# --- tavola degli accessi ----------------------------------------------------------
# cammino: i concetti attraversati, con il numero di accessi e il tipo (L lettura,
# S scrittura). filtri: le colonne su cui l'operazione seleziona, che devono avere
# un indice che le abbia come prima colonna.

[[accessi]]
id = "AC-1"
operazione = "Elenco degli interventi aperti, prima pagina"
tipo = "interattiva"
frequenza = 200
per = "giorno"
traccia = ["INT-6", "RNF-1"]
filtri = ["interventi.stato"]
cammino = [
  { concetto = "entita:intervento", accessi = 25, tipo = "L" },
  { concetto = "relazione:veicolo-intervento", accessi = 25, tipo = "L" },
  { concetto = "entita:veicolo", accessi = 25, tipo = "L" },
  { concetto = "relazione:cliente-veicolo", accessi = 25, tipo = "L" },
  { concetto = "entita:cliente", accessi = 25, tipo = "L" },
]

