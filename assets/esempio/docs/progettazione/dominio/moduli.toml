# Sottodomini, moduli e context map. Ogni bounded context è un modulo: un solo
# confine da progettare, possedere e verificare. archetipo, rischio e comunicazione
# si aggiungono in fase 4.

[[sottodomini]]
id = "officina"
tipo = "core"
descrizione = "Interventi, preventivi e prezzi: il lavoro che distingue l'officina."

[[sottodomini]]
id = "anagrafiche"
tipo = "supporto"
descrizione = "Clienti e veicoli."

[[sottodomini]]
id = "fatturazione"
tipo = "supporto"
descrizione = "Fatture numerate, immutabili e in PDF."

[[sottodomini]]
id = "identita"
tipo = "generico"
descrizione = "Account, accesso, ruoli."

[[moduli]]
id = "accessi"
sottodominio = "identita"
responsabilita = "Ciclo di vita degli account, accesso, secondo fattore, inviti e recupero; nessuna regola di dominio dell'officina."
archetipo = "workflow"
rischio = "alto"

[[moduli]]
id = "clienti"
sottodominio = "anagrafiche"
responsabilita = "Anagrafica dei clienti e collegamento al loro account."
