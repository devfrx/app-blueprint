rischio = "standard"

[[moduli]]
id = "veicoli"
sottodominio = "anagrafiche"
responsabilita = "Veicoli dei clienti e loro proprietario."
archetipo = "crud"
rischio = "standard"

[[moduli]]
id = "interventi"
sottodominio = "officina"
responsabilita = "Interventi e preventivi, con le loro macchine a stati."
archetipo = "workflow"
rischio = "standard"

[[moduli]]
id = "prezzi"
sottodominio = "officina"
responsabilita = "Listino e motore dei prezzi: l'unico posto dove si calcolano i totali (R-2)."
