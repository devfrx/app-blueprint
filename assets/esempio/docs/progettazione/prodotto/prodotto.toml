# Prodotto — fase 1. Il ragionamento sta in visione.md; qui ciò che altri citano per id.

[[obiettivi]]
id = "OB-1"
testo = "L'officina gestisce preventivi, interventi e fatture solo con Officina, senza fogli di calcolo."
metrica = "Quota degli interventi del mese gestiti in Officina"
valore = "100% dal secondo mese d'uso"
misura = "Confronto mensile tra gli interventi in Officina e il registro cartaceo, finché esiste"

[[obiettivi]]
id = "OB-2"
testo = "Emettere una fattura costa meno tempo e nessuna trascrizione."
metrica = "Minuti tra la chiusura dell'intervento e l'emissione della fattura"
valore = "Meno di 2 minuti al 90° percentile"
misura = "Differenza tra chiuso_il dell'intervento ed emessa_il della fattura"

[[obiettivi]]
id = "OB-3"
testo = "I clienti seguono lo stato dei propri interventi senza telefonare."
metrica = "Telefonate per chiedere lo stato, a settimana"
valore = "-50% entro tre mesi"
misura = "Registro delle telefonate tenuto dall'operatore per tre mesi"

