entita = ["fattura", "riga_fattura"]
modulo = "fatture"

[[storie]]
id = "FAT-3"
titolo = "Il responsabile scarica il PDF di una fattura per il commercialista"
attore = "responsabile"
priorita = "must"
incremento = 1
