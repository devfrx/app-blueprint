  { nome = "Approva preventivo", ruoli = ["responsabile"], operazione = "approvaPreventivo", nome_accessibile = "Approva il preventivo" },
  { nome = "Chiudi intervento", ruoli = ["operatore", "responsabile"], operazione = "chiudiIntervento", nome_accessibile = "Chiudi l'intervento" },
  { nome = "Emetti fattura", ruoli = ["responsabile"], operazione = "emettiFattura", nome_accessibile = "Emetti la fattura" },
]

