  { nome = "Pagina successiva", ruoli = ["operatore", "responsabile"], operazione = "elencoInterventiAperti", nome_accessibile = "Pagina successiva" },
]

[[schermate]]
id = "intervento"
pattern = "dettaglio"
scopo = "Seguire un intervento: preventivo, approvazione, chiusura, fattura."
ruoli = ["operatore", "responsabile"]
storie = ["INT-1", "INT-5", "INT-2", "INT-4", "FAT-1"]
dati = ["dettaglioIntervento", "elencoVociListino"]
testi = ["intervento.titolo", "intervento.preventivo-vuoto"]
mockup = "docs/design/mockups/intervento.html"
stati = { caricamento = "Intestazione e preventivo in scheletro.", vuoto = "Preventivo senza righe: il comando Aggiungi riga in evidenza.", errore = "conflitto-di-versione ricarica e spiega; gli altri errori accanto all'azione che li ha causati.", parziale = "Preventivo mostrato anche se il listino non si carica: Aggiungi riga disabilitato con il motivo.", successo = "Stato, righe, totali del motore e le azioni consentite al ruolo.", permesso_negato = "Le azioni non consentite al ruolo non compaiono; il backend le rifiuta comunque." }
azioni = [
