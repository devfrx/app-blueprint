# UX — personas, architettura dell'informazione, una voce per schermata.
# Ogni schermata è progettata nei sei stati; "non-applicabile: motivo" quando uno
# stato non può verificarsi. I nomi accessibili sono quelli che gli oracoli e i test
# end-to-end cercano per ruolo e nome.

[[personas]]
id = "giulia"
attore = "operatore"
descrizione = "Operatrice d'accettazione, al banco con il telefono che squilla; usa il PC dell'officina."
obiettivi = "Aprire un intervento in meno di un minuto e non riscrivere mai lo stesso dato."

[[personas]]
id = "marco"
attore = "responsabile"
descrizione = "Titolare: approva tra un lavoro e l'altro, spesso dal telefono."
obiettivi = "Approvare e fatturare in pochi tocchi, con i totali giusti."

[[personas]]
id = "anna"
attore = "cliente"
descrizione = "Cliente occasionale, apre il link dal telefono."
obiettivi = "Sapere quando riavrà l'auto senza telefonare."

[[sezioni]]
id = "lavoro"
nome = "Lavoro"
ruoli = ["operatore", "responsabile"]

[[sezioni]]
id = "amministrazione"
nome = "Amministrazione"
ruoli = ["responsabile"]

[[sezioni]]
id = "area-cliente"
nome = "I miei interventi"
ruoli = ["cliente"]

[[rotte]]
percorso = "/accesso"
schermata = "accesso"
ruoli = ["operatore", "responsabile", "cliente"]

[[rotte]]
percorso = "/attivazione/{token}"
schermata = "attivazione"
ruoli = ["operatore", "responsabile", "cliente"]

[[rotte]]
percorso = "/recupero-password"
schermata = "recupero-password"
ruoli = ["operatore", "responsabile", "cliente"]

[[rotte]]
percorso = "/informativa"
schermata = "informativa"
ruoli = ["operatore", "responsabile", "cliente"]

[[rotte]]
percorso = "/*"
schermata = "non-trovato"
ruoli = ["operatore", "responsabile", "cliente"]

[[rotte]]
percorso = "/interventi"
schermata = "interventi-aperti"
ruoli = ["operatore", "responsabile"]

[[rotte]]
percorso = "/interventi/{id}"
schermata = "intervento"
ruoli = ["operatore", "responsabile"]

[[rotte]]
percorso = "/clienti"
schermata = "clienti"
ruoli = ["operatore", "responsabile"]

[[rotte]]
percorso = "/clienti/{id}"
schermata = "cliente-scheda"
ruoli = ["operatore", "responsabile"]

[[rotte]]
percorso = "/fatture/{id}"
schermata = "fattura"
ruoli = ["responsabile"]

[[rotte]]
percorso = "/fatture/esportazione"
schermata = "esportazione-fatture"
ruoli = ["responsabile"]

[[rotte]]
percorso = "/account"
schermata = "account"
ruoli = ["responsabile"]

[[rotte]]
percorso = "/listino"
schermata = "listino"
ruoli = ["responsabile"]

[[rotte]]
percorso = "/area-cliente/interventi/{id}"
schermata = "area-cliente-intervento"
ruoli = ["cliente"]

[[schermate]]
id = "accesso"
pattern = "modulo"
scopo = "Accedere con email e password, e con il codice per il responsabile."
ruoli = ["operatore", "responsabile", "cliente"]
storie = ["ACC-1", "ACC-4"]
dati = ["accedi", "verificaSecondoFattore"]
testi = ["accesso.titolo", "accesso.recupero"]
mockup = "docs/design/mockups/accesso.html"
stati = { caricamento = "Il bottone Accedi resta premuto e disabilitato fino alla risposta.", vuoto = "non-applicabile: un modulo senza dati da caricare", errore = "Il messaggio del catalogo sopra il modulo, annunciato ai lettori di schermo; il focus torna al campo email.", parziale = "non-applicabile: nessun dato parziale", successo = "Reindirizza alla pagina iniziale del ruolo, o al campo del codice per il responsabile.", permesso_negato = "non-applicabile: pagina pubblica" }
azioni = [
  { nome = "Accedi", ruoli = ["operatore", "responsabile", "cliente"], operazione = "accedi", nome_accessibile = "Accedi" },
  { nome = "Verifica il codice", ruoli = ["responsabile"], operazione = "verificaSecondoFattore", nome_accessibile = "Verifica il codice" },
]

[[schermate]]
id = "attivazione"
pattern = "modulo"
scopo = "Scegliere la password e attivare l'account dall'invito."
ruoli = ["operatore", "responsabile", "cliente"]
storie = ["ACC-5", "ACC-6"]
dati = ["attivaAccount"]
testi = ["attivazione.titolo", "attivazione.informativa"]
stati = { caricamento = "Bottone disabilitato fino alla risposta.", vuoto = "non-applicabile: un modulo", errore = "link-non-valido mostra come chiedere un nuovo invito; password-debole resta sul campo.", parziale = "non-applicabile", successo = "Account attivo: entra nella pagina iniziale del ruolo.", permesso_negato = "non-applicabile: pagina pubblica" }
azioni = [
  { nome = "Attiva l'account", ruoli = ["operatore", "responsabile", "cliente"], operazione = "attivaAccount", nome_accessibile = "Attiva l'account" },
]

[[schermate]]
id = "recupero-password"
pattern = "modulo"
scopo = "Chiedere il link di recupero e impostare una nuova password."
ruoli = ["operatore", "responsabile", "cliente"]
storie = ["ACC-3"]
dati = ["chiediRecuperoPassword", "impostaPasswordDaRecupero"]
testi = ["recupero.titolo", "recupero.conferma"]
stati = { caricamento = "Bottone disabilitato fino alla risposta.", vuoto = "non-applicabile: un modulo", errore = "troppe-richieste o link-non-valido, con l'azione da fare.", parziale = "non-applicabile", successo = "La stessa conferma che l'account esista o no.", permesso_negato = "non-applicabile: pagina pubblica" }
azioni = [
  { nome = "Invia il link", ruoli = ["operatore", "responsabile", "cliente"], operazione = "chiediRecuperoPassword", nome_accessibile = "Invia il link di recupero" },
]

[[schermate]]
id = "informativa"
pattern = "pagina"
scopo = "Leggere l'informativa privacy senza accedere."
ruoli = ["operatore", "responsabile", "cliente"]
storie = ["ACC-6"]
testi = ["informativa.titolo"]
stati = { caricamento = "non-applicabile: pagina statica", vuoto = "non-applicabile: pagina statica", errore = "non-applicabile: pagina statica", parziale = "non-applicabile", successo = "Il testo dell'informativa.", permesso_negato = "non-applicabile: pagina pubblica" }
azioni = []

[[schermate]]
id = "non-trovato"
pattern = "pagina"
scopo = "Dire che la pagina non esiste e riportare alla pagina iniziale."
ruoli = ["operatore", "responsabile", "cliente"]
storie = ["ACC-6"]
testi = ["errore.non-trovato"]
stati = { caricamento = "non-applicabile", vuoto = "non-applicabile", errore = "È essa stessa lo stato d'errore.", parziale = "non-applicabile", successo = "non-applicabile", permesso_negato = "non-applicabile" }
azioni = [
  { nome = "Torna alla pagina iniziale", ruoli = ["operatore", "responsabile", "cliente"], nome_accessibile = "Torna alla pagina iniziale" },
]

[[schermate]]
id = "interventi-aperti"
pattern = "elenco"
scopo = "Vedere gli interventi non chiusi, i più vecchi per primi."
ruoli = ["operatore", "responsabile"]
storie = ["INT-6", "ACC-1"]
